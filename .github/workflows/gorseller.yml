          <text x="{tx:.0f}" y="{ty-22 if up else ty}" text-anchor="{anchor}" {FONT} font-size="11" letter-spacing="2.5" fill="{col}">{d}</text>
          <text x="{tx:.0f}" y="{ty-2 if up else ty+22}" text-anchor="{anchor}" {FONT} font-size="16" font-weight="600" fill="{WHITE}">{t}</text>
          <text x="{tx:.0f}" y="{ty+17 if up else ty+41}" text-anchor="{anchor}" {FONT} font-size="12" fill="{MUTED}">{s}</text></g>"""
              return f"""<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
          <defs>{base_defs(W, H)}
          <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{GOLD}" stop-opacity="0.1"/><stop offset="0.85" stop-color="{GOLD}"/><stop offset="1" stop-color="{CYAN}"/></linearGradient>
          <radialGradient id="pulse"><stop offset="0" stop-color="#fff"/><stop offset="0.3" stop-color="{GOLD}"/><stop offset="1" stop-color="{GOLD}" stop-opacity="0"/></radialGradient></defs>
          <rect width="{W}" height="{H}" rx="8" fill="#06080f"/>
          <line x1="{x0}" y1="{y}" x2="{x0}" y2="{y}" stroke="url(#ln)" stroke-width="2"><animate attributeName="x2" from="{x0}" to="{x1}" dur="2.6s" begin="0.2s" fill="freeze"/></line>
          <circle cx="{x0}" cy="{y}" r="16" fill="url(#pulse)" opacity="0"><animate attributeName="cx" from="{x0}" to="{x1}" dur="4s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="3s" repeatCount="indefinite"/></circle>
          {nodes}</svg>"""
 
          # ---------------- KAPANIŞ ----------------
