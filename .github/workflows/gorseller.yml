name: Profil Gorselleri
 
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gorseller.yml
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Sinematik gorselleri olustur
        run: |
          cat > /tmp/gen.py <<'PYEOF'
          import random, os
          os.makedirs("assets", exist_ok=True)
 
          FONT = "font-family=\"'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif\""
          GOLD, CYAN, WHITE, MUTED = "#ffb547", "#4cc9f0", "#f4f6fb", "#8a93b0"
 
          def embers(w, h, n, seed):
              r = random.Random(seed); out = []
              for _ in range(n):
                  x = r.uniform(0, w); y0 = r.uniform(h * 0.5, h + 20); dy = r.uniform(80, 220)
                  rad = r.choice([1, 1, 1.5, 2]); dur = r.uniform(5, 11); beg = r.uniform(0, 8)
                  col = r.choice([GOLD, GOLD, CYAN, WHITE])
                  out.append(f'<circle cx="{x:.0f}" cy="{y0:.0f}" r="{rad}" fill="{col}" opacity="0">'
                             f'<animate attributeName="cy" from="{y0:.0f}" to="{y0-dy:.0f}" dur="{dur:.1f}s" begin="{beg:.1f}s" repeatCount="indefinite"/>'
                             f'<animate attributeName="opacity" values="0;0.9;0" dur="{dur:.1f}s" begin="{beg:.1f}s" repeatCount="indefinite"/></circle>')
              return "".join(out)
 
          def corners(w, h, m=22, l=34, col=GOLD, op=0.7):
              p = [(m, m, 1, 1), (w - m, m, -1, 1), (m, h - m, 1, -1), (w - m, h - m, -1, -1)]
              return "".join(f'<path d="M{x} {y+sy*l}V{y}H{x+sx*l}" fill="none" stroke="{col}" stroke-width="2" opacity="{op}"/>' for x, y, sx, sy in p)
 
          def base_defs(w, h):
              return f'''<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04050a"/><stop offset="0.6" stop-color="#0a1024"/><stop offset="1" stop-color="#04050a"/></linearGradient>
          <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.85"/></radialGradient>
          <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="{GOLD}" stop-opacity="0.35"/><stop offset="1" stop-color="{GOLD}" stop-opacity="0"/></radialGradient>
          <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="{CYAN}" stop-opacity="0.22"/><stop offset="1" stop-color="{CYAN}" stop-opacity="0"/></radialGradient>
          <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
            <stop offset="0" stop-color="{WHITE}"/><stop offset="0.45" stop-color="{WHITE}"/><stop offset="0.5" stop-color="{GOLD}"/><stop offset="0.55" stop-color="{WHITE}"/><stop offset="1" stop-color="{WHITE}"/>
            <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="{w+400} 0" dur="5s" begin="1.6s" repeatCount="indefinite"/></linearGradient>'''
 
          # ---------------- HERO ----------------
          def hero():
              W, H = 1200, 440
              tags = ["UNITY", "UNREAL ENGINE", "C++", "BLENDER"]
              tw = [len(t) * 11 + 48 for t in tags]; gap = 16; tx = (W - (sum(tw) + gap * (len(tags) - 1))) / 2; tag_svg = ""
              for i, (t, w) in enumerate(zip(tags, tw)):
                  tag_svg += (f'<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="{2.2+i*0.25}s" dur="0.6s" fill="freeze"/>'
                              f'<rect x="{tx:.0f}" y="338" width="{w}" height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="{GOLD}" stroke-opacity="0.55"/>'
                              f'<text x="{tx+w/2:.0f}" y="361" text-anchor="middle" {FONT} font-size="13" letter-spacing="3" fill="{WHITE}">{t}</text></g>')
                  tx += w + gap
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
          <defs>{base_defs(W, H)}</defs>
          <rect width="{W}" height="{H}" fill="url(#bg)"/>
          <ellipse cx="300" cy="200" rx="420" ry="260" fill="url(#glowC)"><animate attributeName="cx" values="260;420;260" dur="14s" repeatCount="indefinite"/></ellipse>
          <ellipse cx="900" cy="240" rx="460" ry="280" fill="url(#glowG)"><animate attributeName="cx" values="940;780;940" dur="16s" repeatCount="indefinite"/></ellipse>
          <g opacity="0.9"><rect x="-300" y="-200" width="160" height="900" fill="url(#beam)" transform="rotate(22)"><animate attributeName="x" from="-400" to="1500" dur="7s" repeatCount="indefinite"/></rect></g>
          {embers(W, H, 55, 11)}
          <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1.2s" fill="freeze"/>
          <text x="{W/2}" y="120" text-anchor="middle" {FONT} font-size="15" letter-spacing="9" fill="{GOLD}">TRABZON ÜNİVERSİTESİ  ·  DİJİTAL OYUN TASARIMI</text></g>
          <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.4s" fill="freeze"/>
          <text x="{W/2}" y="168" text-anchor="middle" {FONT} font-size="22" font-weight="300" letter-spacing="16" fill="{MUTED}">MUHAMMED</text></g>
          <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="1.4s" fill="freeze"/>
          <text x="{W/2}" y="238" text-anchor="middle" {FONT} font-size="66" font-weight="300" fill="url(#shine)" letter-spacing="14">VEHBİ ÇETİNKAYA<animate attributeName="letter-spacing" from="34" to="14" begin="0.9s" dur="2s" fill="freeze"/></text></g>
          <g><line x1="{W/2}" y1="272" x2="{W/2}" y2="272" stroke="{GOLD}" stroke-width="1.5"><animate attributeName="x1" from="{W/2}" to="{W/2-230}" begin="1.5s" dur="1s" fill="freeze"/><animate attributeName="x2" from="{W/2}" to="{W/2+230}" begin="1.5s" dur="1s" fill="freeze"/></line>
          <rect x="{W/2-5}" y="267" width="10" height="10" fill="{GOLD}" transform="rotate(45 {W/2} 272)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/></rect></g>
          <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="1s" fill="freeze"/>
          <text x="{W/2}" y="312" text-anchor="middle" {FONT} font-size="17" letter-spacing="7" fill="{WHITE}">GAME DESIGNER  ·  DEVELOPER  ·  3D ARTIST</text></g>
          {tag_svg}
          <rect width="{W}" height="{H}" fill="url(#vig)"/>
          <rect width="{W}" height="34" fill="#000"/><rect y="{H-34}" width="{W}" height="34" fill="#000"/>
          {corners(W, H, 48, 30)}
          <text x="60" y="{H-13}" {FONT} font-size="11" letter-spacing="3" fill="{MUTED}">EST. 2022</text>
          <text x="{W-60}" y="{H-13}" text-anchor="end" {FONT} font-size="11" letter-spacing="3" fill="{MUTED}">TRABZON, TR</text>
          </svg>'''
 
          # ---------------- BÖLÜM BAŞLIĞI ----------------
          def header(num, title, sub):
              W, H = 1200, 110
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
          <defs>{base_defs(W, H)}</defs>
          <rect width="{W}" height="{H}" rx="6" fill="#06080f"/>
          <rect width="{W}" height="{H}" rx="6" fill="url(#bg)" opacity="0.8"/>
          <g opacity="0.9"><rect x="-300" y="-200" width="120" height="600" fill="url(#beam)" transform="rotate(22)"><animate attributeName="x" from="-300" to="1500" dur="6s" repeatCount="indefinite"/></rect></g>
          <text x="48" y="66" {FONT} font-size="40" font-weight="200" fill="{GOLD}" opacity="0.9">{num}</text>
          <line x1="112" y1="30" x2="112" y2="80" stroke="{GOLD}" stroke-opacity="0.5"/>
          <text x="136" y="58" {FONT} font-size="26" font-weight="300" letter-spacing="10" fill="url(#shine)">{title}</text>
          <text x="138" y="84" {FONT} font-size="13" letter-spacing="3" fill="{MUTED}">{sub}</text>
          <line x1="0" y1="{H-1}" x2="0" y2="{H-1}" stroke="{GOLD}" stroke-opacity="0.6"><animate attributeName="x2" from="0" to="{W}" dur="1.6s" fill="freeze"/></line>
          </svg>'''
 
          # ---------------- YARDIMCI: METİN SARMA ----------------
          def wrap(s, n):
              parts = []
              for seg in s.split(" · "):
                  if len(seg) <= n: parts.append(seg); continue
                  cur = ""
                  for w in seg.split(" "):
                      if cur and len(cur) + 1 + len(w) > n: parts.append(cur); cur = w
                      else: cur = (cur + " " + w) if cur else w
                  parts.append(cur)
              lines, cur = [], ""
              for p in parts:
                  cand = (cur + " · " + p) if cur else p
                  if len(cand) > n and cur: lines.append(cur); cur = p
                  else: cur = cand
              lines.append(cur)
              return lines
 
          def frame(W, H, body, glow=True):
              g = '<ellipse cx="%d" cy="%d" rx="%d" ry="%d" fill="url(#glowG)" opacity="0.5"/>' % (W/2, H/2, W*0.45, H*0.6) if glow else ""
              return f"""<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
          <defs>{base_defs(W, H)}</defs>
          <rect width="{W}" height="{H}" rx="8" fill="#06080f"/>
          {g}{body}</svg>"""
 
          # ---------------- ÖNE ÇIKANLAR ----------------
          def highlights():
              W, H = 1200, 210
              items = [("80+", "3D MODEL", "8 Blender reposunda"), ("1", "OYUN · YAKINDA STEAM'DE", "SheepFarmVille · Unity"),
                       ("6.500+", "LINKEDIN TAKİPÇİ", "500+ bağlantı"), ("5", "SERTİFİKA", "4× C++ · Frontend")]
              cw, g = 270, 20; x0 = (W - (cw * 4 + g * 3)) / 2; out = ""
              for i, (n, t, s) in enumerate(items):
                  x = x0 + i * (cw + g); b = 0.2 + i * 0.25
                  out += f"""<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="{b}s" dur="0.8s" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" begin="{b}s" dur="0.8s" fill="freeze"/>
          <rect x="{x:.0f}" y="24" width="{cw}" height="160" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
          <rect x="{x:.0f}" y="24" width="{cw}" height="3" rx="1.5" fill="{GOLD}" opacity="0.8"/>
          <text x="{x+cw/2:.0f}" y="100" text-anchor="middle" {FONT} font-size="52" font-weight="200" fill="{WHITE}">{n}</text>
          <text x="{x+cw/2:.0f}" y="132" text-anchor="middle" {FONT} font-size="12" letter-spacing="3" fill="{GOLD}">{t}</text>
          <text x="{x+cw/2:.0f}" y="158" text-anchor="middle" {FONT} font-size="13" fill="{MUTED}">{s}</text></g>"""
              return frame(W, H, out)
 
          # ---------------- ÖNE ÇIKAN PROJELER ----------------
          def projects():
              W, H = 1200, 330
              cards = [
                  ("SHEEPFARMVILLE", "UNITY", CYAN, "YAKINDA STEAM'DE",
                   ["Yaklaşık 1 ayda geliştirdiğim çiftlik oyunu", "Trabzon Üniversitesi OGP kulübü adına", "Trabzon BilimFest 2026'da sergilendi"]),
                  ("PHANTOMLAND", "UNREAL ENGINE 5 · C++", GOLD, "GELİŞTİRİLİYOR",
                   ["Gece-gündüz döngüsü (Directional Light)", "Eve girince gizlenen tavan (Box Collision)", "Dönen deniz feneri (Sphere Component)"]),
              ]
              cw, g = 570, 20; x0 = (W - (cw * 2 + g)) / 2; out = ""
              for i, (name, eng, col, badge, feats) in enumerate(cards):
                  x = x0 + i * (cw + g); b = 0.2 + i * 0.35
                  bw = len(badge) * 9 + 30
                  fl = "".join(f'<path d="M{x+40:.0f} {176+k*36} l6 -6 l6 6 l-6 6 z" fill="{col}"/><text x="{x+60:.0f}" y="{181+k*36}" {FONT} font-size="16" fill="{WHITE}">{f}</text>' for k, f in enumerate(feats))
                  out += f"""<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="{b}s" dur="0.9s" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="{b}s" dur="0.9s" fill="freeze"/>
          <rect x="{x:.0f}" y="20" width="{cw}" height="290" rx="12" fill="#ffffff" fill-opacity="0.035" stroke="{col}" stroke-opacity="0.35"/>
          <rect x="{x:.0f}" y="20" width="4" height="290" rx="2" fill="{col}"/>
          <text x="{x+40:.0f}" y="62" {FONT} font-size="12" letter-spacing="4" fill="{col}">{eng}</text>
          <text x="{x+38:.0f}" y="112" {FONT} font-size="40" font-weight="300" letter-spacing="6" fill="url(#shine)">{name}</text>
          <rect x="{x+cw-bw-30:.0f}" y="40" width="{bw}" height="30" rx="15" fill="{col}" fill-opacity="0.12" stroke="{col}" stroke-opacity="0.7"/>
          <circle cx="{x+cw-bw-14:.0f}" cy="55" r="4" fill="{col}"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
          <text x="{x+cw-bw/2-24:.0f}" y="60" text-anchor="middle" {FONT} font-size="11" letter-spacing="2" fill="{col}">{badge}</text>
          <line x1="{x+40:.0f}" y1="136" x2="{x+cw-40:.0f}" y2="136" stroke="#ffffff" stroke-opacity="0.08"/>
          {fl}</g>"""
              return frame(W, H, out)
 
          # ---------------- KART IZGARASI ----------------
          def grid(cards, H, cw, g, icon_fn=None, wrapn=22):
              W = 1200; n = len(cards); x0 = (W - (cw * n + g * (n - 1))) / 2; out = ""
              for i, c in enumerate(cards):
                  x = x0 + i * (cw + g); cx = x + cw / 2; b = 0.2 + i * 0.18
                  title, sub, foot, ic = c
                  body = ""
                  y = 64
                  if ic:
                      body += f"""<circle cx="{cx:.0f}" cy="78" r="38" fill="url(#glowG)"/>
          <circle cx="{cx:.0f}" cy="78" r="32" fill="none" stroke="{GOLD}" stroke-opacity="0.35" stroke-dasharray="4 6"><animateTransform attributeName="transform" type="rotate" from="0 {cx:.0f} 78" to="360 {cx:.0f} 78" dur="{16+i*3}s" repeatCount="indefinite"/></circle>
          <path d="{ic}" transform="translate({cx:.0f} 78) scale(1.05)" fill="none" stroke="{WHITE}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>"""
                      y = 146
                  tl = wrap(title, 18) if " · " in title else [title]
                  for k, l in enumerate(tl):
                      body += f'<text x="{cx:.0f}" y="{y+k*18}" text-anchor="middle" {FONT} font-size="12" letter-spacing="2.5" fill="{GOLD}">{l}</text>'
                  y += len(tl) * 18 + 10
                  for k, l in enumerate(wrap(sub, wrapn)):
                      body += f'<text x="{cx:.0f}" y="{y+k*19}" text-anchor="middle" {FONT} font-size="13" fill="{MUTED}">{l}</text>'
                  if foot:
                      body += f'<text x="{cx:.0f}" y="{H-34}" text-anchor="middle" {FONT} font-size="11" letter-spacing="2.5" fill="{WHITE}" opacity="0.75">{foot}</text>'
                  out += f"""<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="{b}s" dur="0.8s" fill="freeze"/>
          <rect x="{x:.0f}" y="20" width="{cw}" height="{H-40}" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
          {body}</g>"""
              return frame(W, H, out, glow=False)
 
          ICON = {
              "house": "M-18 4 L0 -14 L18 4 M-13 0 V16 H13 V0 M-4 16 V6 H4 V16",
              "car": "M-20 6 H20 V-2 L12 -4 L6 -12 H-8 L-14 -4 L-20 -2 Z M-12 6 a4 4 0 1 0 0.1 0 M12 6 a4 4 0 1 0 0.1 0",
              "plane": "M-22 0 H22 M4 0 L-6 -16 H-1 L10 0 L-1 16 H-6 Z M-18 0 L-22 -8 M-18 0 L-22 8",
              "ship": "M0 -18 L8 6 L0 2 L-8 6 Z M-20 10 L-8 0 M20 10 L8 0 M-20 10 V-6 M20 10 V-6",
              "stadium": "M-20 -4 a20 10 0 1 0 40 0 a20 10 0 1 0 -40 0 M-20 -4 V8 a20 10 0 0 0 40 0 V-4 M0 -14 V6",
              "drop": "M0 -18 C 8 -6 12 0 12 6 a12 12 0 0 1 -24 0 C -12 0 -8 -6 0 -18 Z M-5 6 a5 5 0 0 0 5 5",
              "target": "M-16 0 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0 M-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M0 -22 V-12 M0 12 V22 M-22 0 H-12 M12 0 H22",
              "bolt": "M4 -18 L-10 2 H0 L-4 18 L10 -2 H0 Z",
              "line": "M-20 -12 L20 8 M-14 -9 V4 M14 5 V-6 M-4 -4 L-4 8 L4 8 L4 0",
              "chest": "M-16 -4 H16 V14 H-16 Z M-16 -4 V-10 a6 6 0 0 1 6 -6 H10 a6 6 0 0 1 6 6 V-4 M-3 2 H3 V8 H-3 Z",
              "ball": "M-14 0 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0 M-14 0 H14 M0 -14 C 8 -6 8 6 0 14 M0 -14 C -8 -6 -8 6 0 14",
              "stairs": "M-18 14 H-6 V4 H6 V-6 H18 V-16",
          }
 
          def unreal():
              cards = [("ZOMBİ FPS", "3 zombi dalgası · her dalgada 2 katı · silah tepmesi", "UE5", ICON["target"]),
                       ("FLASH BOMBASI", "Sersemletme efekti · fırlatılabilir bomba", "UE5", ICON["bolt"]),
                       ("ZIPLINE", "Halatla kayma mekaniği", "UE5", ICON["line"]),
                       ("LOOT SİSTEMİ", "Ölen düşmandan eşya toplama", "UE5", ICON["chest"]),
                       ("FİZİK OYUNU", "20 küre hakkı · otomatik level reset", "UE5 · C++", ICON["ball"]),
                       ("PLATFORM OYUNLARI", "C++ ile hareket eden platformlar · 3D platform", "UE5 · C++", ICON["stairs"])]
              return grid(cards, 300, 183, 12, wrapn=20)
 
          def works():
              cards = [("MİMARİ", "Lüks villa · Japon binaları · orman evleri · deniz feneri · korsan evi", "", ICON["house"]),
                       ("ARAÇ · YARIŞ", "Yarış arabaları · garaj · pist · gemi · traktör · karavan", "", ICON["car"]),
                       ("ASKERİ · BİLİM KURGU", "Askeri üs · savaş uçağı · X-Wing · cyberpunk", "", ICON["ship"]),
                       ("SPOR · ŞEHİR", "Futbol ve tenis stadyumu · basketbol sahası · park · arcade", "", ICON["stadium"]),
                       ("HAVACILIK · ÇİFTLİK", "Havalimanı · hangar · çiftlik · kümes · rüzgâr türbini", "", ICON["plane"]),
                       ("SİMÜLASYON · SHADER", "Kumaş (cloth) · damla · gerçekçi deniz · sis · araba materyali", "", ICON["drop"])]
              return grid(cards, 330, 183, 12, wrapn=20)
 
          def edu():
              cards = [("TRABZON ÜNİVERSİTESİ", "Lisans · Dijital Oyun Tasarımı", "EYL 2026 – DEVAM", None),
                       ("TRABZON ÜNİ. OGP", "Ekip Üyesi", "EYL 2026 – DEVAM", None),
                       ("ÜRETKEN AKADEMİ", "Computer Games and Programming Skills", "TEM – AĞU 2023", None),
                       ("BTK AKADEMİ", "Unity'ye Giriş", "OCA – MAY 2023", None),
                       ("PATİKA.DEV", "Web Page and Information Resources Design", "EKİ 2022 – HAZ 2023", None),
                       ("UDEMY", "Unreal Engine 5 C++ Developer · Python", "PYTHON: DEVAM EDİYOR", None)]
              return grid(cards, 215, 183, 12, wrapn=20)
 
          def certs():
              cs = [("Introduction to C++", "Sololearn", "EKİ 2023"), ("C++ Intermediate", "Sololearn", "KAS 2023"),
                    ("C++", "Programming Hub", "ARA 2023"), ("C++ Advanced", "Programming Hub", "ARA 2023"),
                    ("Frontend Web Development", "Patika.dev", "NİS 2023")]
              W, H = 1200, 200
              cw, g = 216, 15; x0 = (W - (cw * 5 + g * 4)) / 2; out = ""
              for i, (t, o, d) in enumerate(cs):
                  x = x0 + i * (cw + g); b = 0.2 + i * 0.2
                  t1, t2 = (t, "") if len(t) <= 22 else ("Frontend Web", "Development")
                  line2 = ""
                  if t2:
                      line2 = f'<text x="{x+cw/2:.0f}" y="112" text-anchor="middle" {FONT} font-size="16" font-weight="600" fill="{WHITE}">{t2}</text>'
                  out += f"""<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="{b}s" dur="0.8s" fill="freeze"/>
          <rect x="{x:.0f}" y="20" width="{cw}" height="160" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="{GOLD}" stroke-opacity="0.25"/>
          <path d="M{x+cw/2:.0f} 42 l9 5 v10 l-9 5 l-9 -5 v-10 z" fill="none" stroke="{GOLD}" stroke-width="1.6"/>
          <text x="{x+cw/2:.0f}" y="57" text-anchor="middle" {FONT} font-size="10" fill="{GOLD}">✓</text>
          <text x="{x+cw/2:.0f}" y="{98 if not t2 else 92}" text-anchor="middle" {FONT} font-size="16" font-weight="600" fill="{WHITE}">{t1}</text>
          {line2}
          <text x="{x+cw/2:.0f}" y="138" text-anchor="middle" {FONT} font-size="13" fill="{MUTED}">{o}</text>
          <text x="{x+cw/2:.0f}" y="162" text-anchor="middle" {FONT} font-size="11" letter-spacing="2.5" fill="{GOLD}">{d}</text></g>"""
              return frame(W, H, out, glow=False)
 
          # ---------------- ZAMAN ÇİZELGESİ ----------------
          def timeline():
              W, H = 1200, 320
              ev = [("EKİ 2022", "Patika.dev", "Frontend Web Dev."),
                    ("OCA 2023", "BTK Akademi", "Unity'ye Giriş"),
                    ("TEM 2023", "Üretken Akademi", "Oyun ve programlama"),
                    ("2023", "Unreal Engine 5", "C++ ile oyunlar"),
                    ("EKİ–ARA 2023", "C++", "4 sertifika"),
                    ("2023 – 2024", "Blender", "80+ model · simülasyon"),
